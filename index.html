<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class X.5</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e8f8ff, #ffffff);
    color: #234;
}

header {
    text-align: center;
    padding: 75px 20px;
    background: linear-gradient(135deg, #dff6ff, #ffffff);
}

header h1 {
    color: #38a9df;
    font-size: 42px;
    margin: 0 0 10px;
}

header p {
    color: #527080;
    font-size: 18px;
}

button {
    border: none;
    background: #38a9df;
    color: white;
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 17px;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: #238fc2;
}

nav {
    position: sticky;
    top: 0;
    z-index: 10;
    background: white;
    padding: 15px;
    text-align: center;
    box-shadow: 0 3px 15px #b8d9e5;
}

nav a {
    color: #248dbb;
    text-decoration: none;
    font-weight: bold;
    margin: 0 10px;
}

section {
    padding: 50px 20px;
    max-width: 1100px;
    margin: auto;
}

.title {
    text-align: center;
    color: #269aca;
    font-size: 32px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 20px;
    margin-bottom: 20px;
    box-shadow: 0 5px 20px #cde5ee;
}

.card h3 {
    color: #269aca;
}

/* GALERI */

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
}

.photo {
    background: white;
    padding: 10px;
    border-radius: 20px;
    box-shadow: 0 5px 20px #cde5ee;
    overflow: hidden;
}

.photo img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 15px;
    display: block;
    cursor: pointer;
    transition: 0.3s;
}

.photo img:hover {
    transform: scale(1.03);
}

/* FOTO FULLSCREEN */

#viewer {
    display: none;
    position: fixed;
    z-index: 999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.92);
    justify-content: center;
    align-items: center;
}

#viewer img {
    max-width: 95%;
    max-height: 90%;
    border-radius: 15px;
}

#close {
    position: absolute;
    top: 15px;
    right: 25px;
    color: white;
    font-size: 45px;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 30px;
    background: #dff6ff;
    color: #39758e;
}

/* HP */

@media (max-width: 600px) {

    header h1 {
        font-size: 32px;
    }

    header p {
        font-size: 16px;
    }

    nav a {
        display: inline-block;
        margin: 5px;
        font-size: 14px;
    }

    section {
        padding: 35px 15px;
    }
