<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class X.5</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e8f8ff, #ffffff);
    color: #234;
}

/* HEADER */

header {
    text-align: center;
    padding: 60px 20px;
    background: linear-gradient(135deg, #dff6ff, #ffffff);
}

header h1 {
    color: #38a9df;
    font-size: 40px;
    margin: 0 0 10px;
}

header p {
    color: #527080;
    font-size: 17px;
}

/* NAV */

nav {
    position: sticky;
    top: 0;
    z-index: 20;
    background: white;
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 3px 15px #b8d9e5;
}

nav a {
    color: #248dbb;
    text-decoration: none;
    font-weight: bold;
    margin: 0 8px;
    font-size: 14px;
}

/* SECTION */
